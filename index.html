<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Einstein AI | Collected Papers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', Georgia, serif; }
        #answerDisplay { white-space: pre-wrap; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-4xl border border-slate-200">
        <h1 class="text-3xl font-bold mb-2 text-center text-blue-900">Ask Einstein AI</h1>
        <p class="text-center text-slate-600 text-sm mb-6">Explore Albert Einstein's Collected Papers, General & Special Relativity, and Science</p>
        
        <div class="mb-4">
            <label for="questionInput" class="block text-slate-700 text-sm font-bold mb-2">Your Question:</label>
            <input type="text" id="questionInput" class="shadow-sm appearance-none border border-slate-300 rounded-lg w-full py-3 px-4 text-slate-800 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="e.g., What is special relativity?">
        </div>
        
        <button id="askButton" class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 w-full transition duration-200 ease-in-out shadow">
            Ask Einstein
        </button>
        
        <div id="loadingIndicator" role="status" aria-live="polite" class="mt-4 text-center text-blue-800 font-medium hidden">
            <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-blue-800 mr-2"></div>
            <span id="loadingMessage">Finding passages in Einstein's Collected Papers...</span>
        </div>
        
        <div id="answerDisplay" aria-live="polite" class="mt-6 p-6 bg-slate-50 rounded-lg border border-slate-200 text-slate-800 break-words hidden">
        </div>
        
        <div id="exportSection" class="mt-4 flex justify-end">
            <button id="exportLatexBtn" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600 transition duration-200 ease-in-out hidden shadow-sm">
                📄 Export to LaTeX
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const questionInput = document.getElementById('questionInput');
            const askButton = document.getElementById('askButton');
            const answerDisplay = document.getElementById('answerDisplay');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const exportLatexBtn = document.getElementById('exportLatexBtn');
            const loadingMessage = document.getElementById('loadingMessage');
            let requestInFlight = false;

            // Backend API URL on Google Cloud Run
            const backendUrl = "https://einstein-service-465121314425.us-central1.run.app/ask_einstein";

            let userCountry = "Unknown";
            fetch("https://ipapi.co/json/")
                .then(res => res.json())
                .then(data => { if (data && data.country_name) userCountry = data.country_name; })
                .catch(err => console.warn("Could not determine user location:", err));

            async function sendMessage() {
                const question = questionInput.value.trim();
                if (!question || requestInFlight) return;
                requestInFlight = true;
                askButton.disabled = true;
                askButton.textContent = 'Preparing your answer...';
                answerDisplay.setAttribute('aria-busy', 'true');
                loadingMessage.textContent = "Finding passages in Einstein's Collected Papers...";
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 90000);
                const progress = setTimeout(() => {
                    loadingMessage.textContent = 'Your answer is still being prepared. The first question after a quiet period can take longer.';
                }, 12000);

                loadingIndicator.classList.remove('hidden');
                answerDisplay.innerHTML = '';
                answerDisplay.classList.add('hidden');
                exportLatexBtn.classList.add('hidden');

                try {
                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal: controller.signal,
                        body: JSON.stringify({ question: question, country: userCountry })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || 'The service is temporarily unavailable. Please try again shortly.');
                    }

                    const data = await response.json();
                    const answer = data.answer || data.response;
                    if (typeof answer !== 'string' || !answer.trim()) {
                        throw new Error('The service returned an empty answer. Please try again.');
                    }
                    answerDisplay.innerHTML = answer;
                    answerDisplay.classList.remove('hidden');
                } catch (error) {
                    answerDisplay.textContent = error.name === 'AbortError'
                        ? 'This request took too long. Please try your question again in a moment.'
                        : error.message;
                    answerDisplay.classList.remove('hidden');
                } finally {
                    loadingIndicator.classList.add('hidden');
                    clearTimeout(timeout);
                    clearTimeout(progress);
                    requestInFlight = false;
                    askButton.disabled = false;
                    askButton.textContent = 'Ask Einstein';
                    answerDisplay.removeAttribute('aria-busy');
                }
            }

            askButton.addEventListener('click', sendMessage);
            questionInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
